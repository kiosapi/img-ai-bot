services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: ./bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      CUBENCE_API_KEY: ${CUBENCE_API_KEY}
      CUBENCE_BASE_URL: ${CUBENCE_BASE_URL}
      RIGHTCODES_API_KEY: ${RIGHTCODES_API_KEY:-}
      RIGHTCODES_BASE_URL: ${RIGHTCODES_BASE_URL:-}
      APIKEYFUN_API_KEY: ${APIKEYFUN_API_KEY:-}
      APIKEYFUN_BASE_URL: ${APIKEYFUN_BASE_URL:-}
      UNITY2_API_KEY: ${UNITY2_API_KEY:-}
      UNITY2_BASE_URL: ${UNITY2_BASE_URL:-}
      REQUIRED_CHANNEL: ${REQUIRED_CHANNEL}
      ADMIN_IDS: ${ADMIN_IDS}
      DEFAULT_DAILY_LIMIT: ${DEFAULT_DAILY_LIMIT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
      DASH_SECRET: ${DASH_SECRET}
      BOT_TOKEN: ${BOT_TOKEN}
      CUBENCE_API_KEY: ${CUBENCE_API_KEY}
      CUBENCE_BASE_URL: ${CUBENCE_BASE_URL}
      RIGHTCODES_API_KEY: ${RIGHTCODES_API_KEY:-}
      RIGHTCODES_BASE_URL: ${RIGHTCODES_BASE_URL:-}
      APIKEYFUN_API_KEY: ${APIKEYFUN_API_KEY:-}
      APIKEYFUN_BASE_URL: ${APIKEYFUN_BASE_URL:-}
      UNITY2_API_KEY: ${UNITY2_API_KEY:-}
      UNITY2_BASE_URL: ${UNITY2_BASE_URL:-}
      REQUIRED_CHANNEL: ${REQUIRED_CHANNEL}
      ADMIN_IDS: ${ADMIN_IDS}
      DEFAULT_DAILY_LIMIT: ${DEFAULT_DAILY_LIMIT}

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8000:3000"
    environment:
      API_URL: http://api:8000

volumes:
  pgdata:
